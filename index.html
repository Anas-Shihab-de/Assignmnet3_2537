<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pokemon Memory Game</title>

  <link rel="stylesheet" href="style.css">

  <!--use Jquery to give site nicer style-->
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>

  <script defer src="index.js"></script>
</head>

<body class="theme-classic">

<header>

  <h1>pokemon game</h1>

  <div class="status-bar">
    <div>Clicks: <span id="clicks">0</span></div>
    <div>Pairs Left: <span id="pairsLeft">0</span></div>
    <div>Pairs Matched: <span id="pairsMatched">0</span></div>
    <div>Total Pairs: <span id="totalPairs">0</span></div>
    <div>Time: <span id="timer">0</span>s</div>
  </div>

  <div class="controls">

    <button id="startBtn">Start Game</button>
    <button id="resetBtn">Reset</button>

    <select id="difficulty">
      <option value="easy">Easy</option>
      <option value="medium">Medium</option>
      <option value="hard">Hard</option>
    </select>

    <select id="theme">
      <option value="classic">Classic</option>
      <option value="dark">Dark</option>
      <option value="fire">Fire</option>
    </select>

    <button id="revealBtn">Reveal Cards</button>

  </div>

</header>

<div id="message"></div>

<div id="game_grid"></div>

</body>

</html>
